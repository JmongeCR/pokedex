<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Pokédex</title>

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#e63946">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Pokédex">
  <link rel="apple-touch-icon" href="/icon.svg">

  <!-- SEO / Share -->
  <meta name="description" content="Explora todos los Pokémon — estadísticas, tipos y más">
  <meta name="color-scheme" content="light dark">

  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>

<header class="hdr">
  <div class="hdr-in">
    <div class="logo">
      <div class="pokeball"></div>
      <span>Pokédex</span>
    </div>
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z"/>
      </svg>
      <input id="srch" type="search" placeholder="Buscar Pokémon..." autocomplete="off" autocorrect="off">
    </div>
    <select id="gs" aria-label="Seleccionar generación">
      <option value="0,151">Gen I</option>
      <option value="151,100">Gen II</option>
      <option value="251,135">Gen III</option>
      <option value="386,107">Gen IV</option>
      <option value="493,156">Gen V</option>
      <option value="649,72">Gen VI</option>
      <option value="721,88">Gen VII</option>
      <option value="809,96">Gen VIII</option>
      <option value="905,120">Gen IX</option>
    </select>
    <button id="themeToggle" aria-label="Cambiar tema" title="Cambiar tema">
      <svg id="iconSun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
        <circle cx="12" cy="12" r="5"/>
        <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
        <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
      </svg>
      <svg id="iconMoon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" style="display:none">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>
  </div>
</header>

<div class="tbar">
  <div class="tbar-in" id="tbar"></div>
</div>

<main class="main">
  <div class="info-bar" id="infoBar"></div>
  <div class="grid" id="grid"></div>
  <div class="pgn" id="pgn" hidden></div>
</main>

<div class="bdrop" id="bdrop" hidden>
  <div class="mbox" id="mbox"></div>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
